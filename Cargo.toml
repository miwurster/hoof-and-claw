[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
futures-channel = "0.3.34"
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
uuid = { version = "1.29.0", default-features = false, features = ["std"] }
sha2 = "0.10.9"
governor = "0.10.4"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
cargo_metadata = "0.23.1"

bitstamp = { path = "crates/bitstamp" }
game = { path = "crates/game" }
guessing = { path = "crates/guessing" }
identity = { path = "crates/identity" }
prices = { path = "crates/prices" }
sqlite = { path = "crates/sqlite" }
test-controls = { path = "crates/test-controls" }
web = { path = "crates/web" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# The build the acceptance suite, the performance cases and verification share (ADR 0015).
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
